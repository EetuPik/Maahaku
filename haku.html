<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Haku</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>
  body {
  background-color: #212529;
  color: white;
  font-family: 'Poppins', sans-serif;
}
h1, h2 {
  font-weight: 600;
}
.navbar {
  background-color: #b7e4c7 !important;
}
.navbar .navbar-brand,
.navbar .nav-link {
  color: #1b4332;
}

</style>

<!-- Sivu hakee JSON tiedot GeoNames-sivuston julkisista API tiedoista -->
<script>
async function haeMaa() {
  const maa = document.getElementById("countryInput").value.trim();
  const tulos = document.getElementById("tulos");

  if (!maa) {
    tulos.innerHTML = "Kirjoita ensin maan nimi.";
    return;
  }

  tulos.innerHTML = "Haetaan tietoja...";

  try {
    const vastaus = await fetch(
      "https://secure.geonames.org/countryInfo?type=JSON&username=pepeli"
    );

    if (!vastaus.ok) {
      throw new Error("Tietojen haku epäonnistui.");
    }

    const data = await vastaus.json();

    const loydettyMaa = data.geonames.find(
      maaData =>
        maaData.countryName.toLowerCase() === maa.toLowerCase()
    );

    if (loydettyMaa) {
      tulos.innerHTML = `
        <h3>${loydettyMaa.countryName}</h3>
        <p><strong>Pääkaupunki:</strong> ${loydettyMaa.capital}</p>
        <p><strong>Väkiluku:</strong> ${Number(loydettyMaa.population).toLocaleString("fi-FI")}</p>
        <p><strong>Pinta-ala:</strong> ${loydettyMaa.areaInSqKm} km²</p>
        <p><strong>Maanosa:</strong> ${loydettyMaa.continentName || "Ei tietoa"}</p>
        <p><strong>Valuutta:</strong> ${loydettyMaa.currencyCode || "Ei tietoa"}</p>
        <p><strong>Kielet:</strong> ${loydettyMaa.languages || "Ei tietoa"}</p>
      `;
    } else {
      tulos.textContent = "Maata ei löytynyt.";
    }
  } catch (virhe) {
    tulos.textContent =
      "Tietojen hakeminen epäonnistui. Tarkista käyttäjätunnus ja yhteys.";
    console.error(virhe);
  }
}
</script>

</head>

<body>

<div class="container text-center my-4">
  <h1>Maahaku</h1>
</div>

<div class="container">
  <nav class="navbar p-3 w-100 navbar-expand-sm">

  <div class="container-fluid ms-5">

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavbar">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">

      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Etusivu</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="haku.html">Maahaku</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="tieto.html">Tietoa sivustosta</a>
        </li>


      </ul>

    </div>

  </div>

</nav>
</div>

<div class="container my-5">
  <h2 class="text-center mb-4">Etsi maita</h2>
  <p class="text-center">(muista kirjoittaa maiden nimet englaniksi Esim. suomi on englaniksi finland.)</p>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <input
        type="text"
        id="countryInput"
        class="form-control"
        placeholder="Kirjoita maan nimi englaniksi..."
      >

      <button
        class="btn btn-success mt-3 w-100"
        onclick="haeMaa()">
        Hae maa
      </button>

      <div id="tulos" class="mt-4"></div>
    </div>
  </div>
</div>

</body>
</html>
